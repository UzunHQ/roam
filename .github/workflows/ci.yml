# Every push and pull request: types, the build, the data, hours, GPS-filter and footpath checks, and the smoke tests in a
# real browser (scripts/smoke.mjs). Red means don't merge.
name: CI
on:
  push:
    branches: [main, roam-v2]
  pull_request:
# Read-only token: CI only reads the code, it never writes to the repo.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run check:hours
      - run: npm run check:data
      - run: npm run check:gps
      - run: npm run check:paths
      - run: npm run check:bus
      - run: npm run check:security
      - run: npx playwright-core install --with-deps chromium
      - name: Smoke tests
        run: |
          npm run dev -- --port 5173 --strictPort > dev.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 1; done
          npm run test:smoke
      - if: failure()
        run: cat dev.log || true

  # The analytics script is served from this site as a pinned copy (public/vendor/umami.js). This says
  # when Umami has published a newer one, and keeps it as an artifact to read and copy in. It needs
  # the network and is news, not an error: it never blocks.
  umami:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-security.mjs --live
      - uses: actions/upload-artifact@v4
        if: hashFiles('tmp/umami-live.js') != ''
        with:
          name: umami-live
          path: tmp/umami-live.js
          retention-days: 14

  # Safari's engine (every iPhone): the built app comes up, searches, opens cards and plans a walk
  # with no errors (scripts/smoke-engine.mjs). New, so it reports without blocking for now.
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps webkit
      - name: WebKit smoke test
        run: |
          npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run test:webkit
      - if: failure()
        run: cat preview.log || true

